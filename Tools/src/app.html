<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Tools</title>
    <!-- The ground, before any stylesheet: a tab never flashes the other
         colour while the page loads. Search's own greys (styles.css). -->
    <style>
      html, body { background: #ffffff; color: #171717; margin: 0; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #1c1c1c; color: #ededed; }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
