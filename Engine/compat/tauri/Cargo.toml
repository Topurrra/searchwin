[package]
name = "tauri"
version = "2.0.0-search"
edition = "2021"
description = "The part of Tauri's API the engine uses, backed by Search's headless engine instead of a Tauri app"
publish = false

[dependencies]
tauri-macros = { path = "../tauri-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
dirs = "5"
