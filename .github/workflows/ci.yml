name: ci

on:
  push:
    branches: [main, 'cloud/**', 'codex/**']
  pull_request:

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the browser
        run: dotnet build Search/Search.csproj -c Debug -p:Platform=x64
      - name: Test Search.Kit
        if: hashFiles('Search.Kit.Tests/*.csproj') != ''
        run: dotnet test Search.Kit.Tests -c Debug
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test browser JavaScript
        run: node --test Search/Assets/js/tests/

  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the engine (light features)
        working-directory: Engine
        run: cargo test --no-default-features

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tool pages
        working-directory: Tools
        run: pnpm install --frozen-lockfile
      - name: Check the tool pages
        working-directory: Tools
        run: pnpm check
      - name: Test the tool pages
        working-directory: Tools
        run: pnpm vitest run
      - name: Build the tool pages
        working-directory: Tools
        run: pnpm build
